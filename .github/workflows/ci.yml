name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Restore, Build, Test, and Validate Package (net10.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.BetterPosters.sln

      - name: Build solution (Release)
        run: dotnet build Jellyfin.Plugin.BetterPosters.sln -c Release --no-restore

      - name: Run offline unit and HTTP contract tests
        run: dotnet test Jellyfin.Plugin.BetterPosters.sln -c Release --no-build --verbosity normal

      - name: Build and validate plugin archive
        run: bash scripts/package-plugin.sh
