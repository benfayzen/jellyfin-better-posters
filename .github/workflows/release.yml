name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Test, Package, and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.BetterPosters.sln

      - name: Build solution (Release)
        run: dotnet build Jellyfin.Plugin.BetterPosters.sln -c Release --no-restore

      - name: Run offline unit and HTTP contract tests
        run: dotnet test Jellyfin.Plugin.BetterPosters.sln -c Release --no-build --verbosity normal

      - name: Build and validate plugin archive
        run: bash scripts/package-plugin.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            artifacts/better-posters_*.zip \
            artifacts/better-posters_*.zip.sha256 \
            artifacts/better-posters_*.zip.md5 \
            --title "${TAG} — Better Posters for Jellyfin 12.4" \
            --generate-notes
